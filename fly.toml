# fly.toml app configuration file for ebadfdtech
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "ebadfdtech"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  RUST_LOG = "site=trace"

[metrics]
port = 8080
path = "/metrics"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
